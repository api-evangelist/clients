meta:
  name: Clients
  description: This is the index of API client, HTTP client, and API consumer tools
    repos being tracked by the API Evangelist network. The collection includes command-line
    HTTP clients, GUI desktop and IDE clients, language-native HTTP libraries, and
    API testing/consumption tools.
  tags:
  - API Clients
  - Clients
  - HTTP Clients
  - HTTP Libraries
  - REST Clients
  portal: null
  github: null
  repo: clients
